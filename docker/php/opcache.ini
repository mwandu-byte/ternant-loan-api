opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Deploys ship immutable images, so the filesystem never changes under a
; running container — safe (and faster) to skip the mtime check on every
; request. A new deploy always means a new container, not a code edit.
opcache.validate_timestamps=0
