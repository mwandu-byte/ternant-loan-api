name: NAALI PUB CI/CD

on:
  push:
    branches:
      - dev

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/loan-management-api-app
  IMAGE_NGINX: ghcr.io/${{ github.repository_owner }}/loan-management-api-nginx

jobs:
  # ================================================================
  # 1. TEST — gates everything else. Nothing builds or deploys on a
  #    red test suite.
  # ================================================================
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, xml, curl, intl, opcache
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml already provides every env var the test suite needs
      # (sqlite in-memory DB, a fixed non-secret JWT_SECRET/APP_KEY, etc.)
      # — no .env file required for tests to run.
      - name: Run test suite
        run: composer test

  # ================================================================
  # 2. BUILD & PUSH — builds the two images (app, nginx) from the same
  #    Dockerfile and pushes both to GHCR, tagged with the commit SHA.
  # ================================================================
  build:
    name: Build and push Docker images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: |
            ${{ env.IMAGE_NGINX }}:${{ github.sha }}
            ${{ env.IMAGE_NGINX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # 3. DEPLOY — ships the two images built above to the VPS and runs
  #    them via `docker compose -f docker-compose.prod.yml`.
  # ================================================================
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN needs read access to packages so the VPS can log in to
      # GHCR and pull the images the `build` job just pushed.
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Copy docker-compose.prod.yml to the VPS
        run: |
          set -e

          scp -P "${{ secrets.VPS_PORT }}" \
            docker-compose.prod.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/Projects/loan-management-api/docker-compose.prod.yml"

      - name: Deploy application
        env:
          # GITHUB_TOKEN is scoped to this job/run only — used here purely
          # to let the VPS authenticate to GHCR and pull the images just
          # built above. It is never written to disk on the server.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          SERVER="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          DEPLOY_PATH="/var/www/Projects/loan-management-api"

          echo "========================================="
          echo "Deploying NAALI PUB"
          echo "Server: ${SERVER}"
          echo "Path: ${DEPLOY_PATH}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "========================================="

          ssh -p "${PORT}" "${SERVER}" \
            "GHCR_TOKEN='${GHCR_TOKEN}' GHCR_ACTOR='${GHCR_ACTOR}' IMAGE_TAG='${IMAGE_TAG}' bash -s" << 'EOF'

            set -e

            cd /var/www/Projects/loan-management-api

            echo "========================================="
            echo "Starting NAALI PUB deployment"
            echo "========================================="

            if [ ! -f .env ]; then
                echo "ERROR: .env file does not exist."
                exit 1
            fi

            echo ".env file found."

            echo "========================================="
            echo "Logging in to GHCR..."
            echo "========================================="

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

            echo "========================================="
            echo "Pulling images (${IMAGE_TAG})..."
            echo "========================================="

            docker compose -f docker-compose.prod.yml pull

            echo "========================================="
            echo "Starting containers..."
            echo "========================================="

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "========================================="
            echo "Running database migrations..."
            echo "========================================="

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "========================================="
            echo "Removing unused images..."
            echo "========================================="

            docker image prune -f

            echo "========================================="
            echo "NAALI PUB deployment completed successfully"
            echo "========================================="

          EOF

      - name: Health check
        env:
          # Repo Variable (Settings → Actions → Variables), not a secret —
          # only needs to change if APP_PORT in the VPS .env differs from
          # docker-compose.prod.yml's default of 8080.
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        run: |
          set -e

          sleep 5

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${{ secrets.VPS_HOST }}:${APP_PORT}/up" || echo "000")

          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status: $STATUS"
            exit 1
          fi

          echo "Health check passed."

      - name: Deployment successful
        run: |
          echo "========================================="
          echo "NAALI PUB DEPLOYMENT SUCCESSFUL"
          echo "========================================="
