name: NAALI PUB CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  # ================================================================
  # 1. TEST — gates the deploy. Nothing ships on a red test suite.
  # ================================================================
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, xml, curl, intl, opcache
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml already provides every env var the test suite needs
      # (sqlite in-memory DB, a fixed non-secret JWT_SECRET/APP_KEY, etc.)
      # — no .env file required for tests to run.
      - name: Run test suite
        run: composer test

  # ================================================================
  # 2. BUILD AND DEPLOY — rsync source to the VPS, install PHP deps
  #    and build directly there. This is an API only — no frontend,
  #    no Node/npm/Vite anywhere in the pipeline.
  # ================================================================
  deploy:
    name: Build and Deploy NAALI PUB
    needs: test
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PHP
      # ============================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, curl, gd, zip
          tools: composer:v2
          coverage: none


      # ============================================================
      # 3. INSTALL PHP DEPENDENCIES
      # ============================================================
      - name: Install Composer dependencies
        run: |
          set -e

          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction


      # ============================================================
      # 4. SETUP SSH
      # ============================================================
      - name: Setup SSH
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ============================================================
      # 5. DEPLOY APPLICATION
      # ============================================================
      - name: Deploy application
        run: |
          set -e

          SERVER="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          DEPLOY_PATH="/var/www/Projects/prod/ternant-loan-api"

          echo "========================================="
          echo "Deploying NAALI PUB"
          echo "Server: ${SERVER}"
          echo "Path: ${DEPLOY_PATH}"
          echo "========================================="


          # --------------------------------------------------------
          # Sync application files
          # --------------------------------------------------------

          echo "Syncing application files..."

          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="vendor" \
            --exclude="storage" \
            --exclude="bootstrap/cache" \
            -e "ssh -p ${PORT}" \
            ./ \
            "${SERVER}:${DEPLOY_PATH}"


          # --------------------------------------------------------
          # Execute deployment commands on server
          # --------------------------------------------------------

          ssh -p "${PORT}" "${SERVER}" << 'EOF'

            set -e

            cd /var/www/Projects/prod/ternant-loan-api

            echo "========================================="
            echo "Starting NAALI PUB deployment"
            echo "========================================="


            # ======================================================
            # Verify environment
            # ======================================================

            echo "Checking environment..."

            if [ ! -f .env ]; then
                echo "ERROR: .env file does not exist."
                exit 1
            fi

            echo ".env file found."


            # ======================================================
            # Install PHP dependencies
            # ======================================================

            echo "========================================="
            echo "Installing Composer dependencies..."
            echo "========================================="

            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction


            # ======================================================
            # Laravel migrations
            # ======================================================

            echo "========================================="
            echo "Running database migrations..."
            echo "========================================="

            php artisan migrate --force


            # ======================================================
            # Clear Laravel caches
            # ======================================================

            echo "========================================="
            echo "Clearing Laravel caches..."
            echo "========================================="

            php artisan optimize:clear


            # ======================================================
            # Optimize Laravel
            # ======================================================

            echo "========================================="
            echo "Optimizing Laravel..."
            echo "========================================="

            php artisan optimize


            # ======================================================
            # Deployment completed
            # ======================================================

            echo "========================================="
            echo "NAALI PUB deployment completed successfully"
            echo "========================================="

          EOF


      # ============================================================
      # 6. DEPLOYMENT SUCCESS
      # ============================================================
      - name: Deployment successful
        run: |
          echo "========================================="
          echo "NAALI PUB DEPLOYMENT SUCCESSFUL"
          echo "========================================="
