# Production stack, run on the VPS. Images are built and pushed by CI
# (.github/workflows/dev.yml) — this file only ever *pulls and runs* them,
# it never builds from source on the server.
#
# One-time setup on the VPS:
#   1. Place this file (and a real .env, never committed) at the deploy path.
#   2. `echo $GHCR_TOKEN | docker login ghcr.io -u <github-username> --password-stdin`
#      (CI does this automatically as part of the deploy step; only needed
#      manually if you ever run these commands by hand).
#
# Deploy (what CI runs over SSH):
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml pull
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
#
# Intentionally NOT included here: a MySQL service. This app was already
# running against an existing MySQL instance before Docker — point DB_HOST
# in the VPS .env at that same database rather than spinning up a fresh,
# empty one in a container. Add a `mysql:` service yourself if you'd
# rather containerize the database too (and migrate the data first).
name: loan-management-api

services:
    app:
        image: ghcr.io/mwandu-byte/loan-management-api-app:${IMAGE_TAG:-latest}
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - storage:/var/www/html/storage/app
        healthcheck:
            test: ["CMD", "php", "artisan", "about", "--only=environment"]
            interval: 30s
            timeout: 10s
            retries: 3

    nginx:
        image: ghcr.io/mwandu-byte/loan-management-api-nginx:${IMAGE_TAG:-latest}
        restart: unless-stopped
        # Defaults to 8080 so it won't silently fight an existing web
        # server/reverse-proxy already bound to 80/443 on the VPS. Point
        # your reverse proxy (or DNS, if this box is dedicated) at
        # APP_PORT, or set APP_PORT=80 in the VPS .env if it's clear to.
        ports:
            - "${APP_PORT:-8080}:80"
        depends_on:
            - app

volumes:
    storage:
